<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>untitled - Paint</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="titlebar" id="titlebar">
    <div class="tb-icon" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
        <rect x="1" y="2" width="14" height="12" fill="#fff" stroke="#000"/>
        <rect x="2" y="3" width="12" height="5" fill="#0080ff"/>
        <rect x="2" y="9" width="4" height="4" fill="#ff0000"/>
        <rect x="7" y="9" width="4" height="4" fill="#ffff00"/>
        <rect x="12" y="9" width="2" height="4" fill="#00a000"/>
      </svg>
    </div>
    <div class="tb-title" id="tbTitle">untitled - Paint</div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btnMin" title="Minimize" tabindex="-1">
        <svg viewBox="0 0 9 8" width="9" height="8" shape-rendering="crispEdges"><rect x="2" y="5" width="5" height="2" fill="#000"/></svg>
      </button>
      <button class="tb-btn" id="btnMax" title="Maximize" tabindex="-1">
        <svg viewBox="0 0 9 8" width="9" height="8" shape-rendering="crispEdges"><rect x="2" y="1" width="5" height="2" fill="#000"/><rect x="2" y="3" width="1" height="4" fill="#000"/><rect x="6" y="3" width="1" height="4" fill="#000"/><rect x="3" y="6" width="3" height="1" fill="#000"/></svg>
      </button>
      <button class="tb-btn tb-close" id="btnClose" title="Close" tabindex="-1">
        <svg viewBox="0 0 9 8" width="9" height="8" shape-rendering="crispEdges"><g fill="#000"><rect x="1" y="1" width="2" height="1"/><rect x="2" y="2" width="2" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="4" y="4" width="2" height="1"/><rect x="5" y="5" width="2" height="1"/><rect x="5" y="1" width="2" height="1"/><rect x="4" y="2" width="2" height="1"/><rect x="2" y="4" width="2" height="1"/><rect x="1" y="5" width="2" height="1"/></g></svg>
      </button>
    </div>
  </div>

  <div class="menubar" id="menubar"></div>

  <div class="client">
    <div class="toolbox" id="toolbox">
      <div class="tools" id="tools"></div>
      <div class="options-frame" id="optionsFrame">
        <div class="options" id="options"></div>
      </div>
    </div>
    <div class="workspace" id="workspace">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="textbar" id="textbar" hidden></div>

  <div class="palette" id="palette">
    <div class="current-colors" id="currentColors">
      <div class="cc cc-bg" id="ccBg" title="Background color"></div>
      <div class="cc cc-fg" id="ccFg" title="Foreground color"></div>
    </div>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="statusbar" id="statusbar">
    <div class="status status-help" id="stHelp">For Help, click Help Topics on the Help Menu.</div>
    <div class="status status-pos" id="stPos">0,0</div>
    <div class="status status-sel" id="stSel" hidden>0 x 0</div>
    <div class="status status-size" id="stSize">640 x 440</div>
  </div>
</div>

<div id="printSheet"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
<script src="paint.js"></script>
</body>
</html>
